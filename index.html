<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galiya Amandyk · Portfolio</title>
<meta name="description" content="Galiya Amandyk — IT planner, PM and developer. Projects from planning to working systems.">
<meta property="og:title" content="Galiya Amandyk · Portfolio">
<meta property="og:description" content="Galiya Amandyk — IT planner, PM and developer. Projects from planning to working systems.">
<meta property="og:image" content="images/galiya-card.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link id="pf-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="pf-style">
/* Layout: blueprint sheet — hero (thesis + plan/build slider), filter rail, project grid, career strip; blue = planning ink, amber = code */
:root{
  --paper:#F1F3F8; --surface:#FFFFFF; --soft:#E3E8F1; --ink:#141C33; --ink-2:#4B5671; --ink-3:#7C86A0;
  --line:#CDD5E3; --grid:rgba(45,86,217,.07); --plan:#2D56D9; --plan-soft:rgba(45,86,217,.10);
  --build:#D9821A; --build-soft:rgba(217,130,26,.13); --scrim:rgba(14,20,34,.55); --card:#FFFFFF; --card-art:#F0F4FC; --card-line:#C3CDE0; --good:#178A55; --glow-a:rgba(45,86,217,.10); --glow-b:rgba(217,130,26,.08);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1322; --surface:#151D31; --soft:#1C2640; --ink:#E7EBF4; --ink-2:#A2ACC4; --ink-3:#717C97;
  --line:#28324B; --grid:rgba(124,155,255,.06); --plan:#7E9CFF; --plan-soft:rgba(126,156,255,.14);
  --build:#F2AC4B; --build-soft:rgba(242,172,75,.15); --scrim:rgba(0,0,0,.65); --card:#1B2440; --card-art:#212D50; --card-line:#33405F; --good:#4CC98C; --glow-a:rgba(126,156,255,.10); --glow-b:rgba(242,172,75,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1322; --surface:#151D31; --soft:#1C2640; --ink:#E7EBF4; --ink-2:#A2ACC4; --ink-3:#717C97;
  --line:#28324B; --grid:rgba(124,155,255,.06); --plan:#7E9CFF; --plan-soft:rgba(126,156,255,.14);
  --build:#F2AC4B; --build-soft:rgba(242,172,75,.15); --scrim:rgba(0,0,0,.65); --card:#1B2440; --card-art:#212D50; --card-line:#33405F; --good:#4CC98C; --glow-a:rgba(126,156,255,.10); --glow-b:rgba(242,172,75,.06); color-scheme:dark}

*{box-sizing:border-box}
body{overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(60vw 50vw at 88% -5%,var(--glow-a),transparent 70%),radial-gradient(55vw 45vw at -10% 35%,var(--glow-b),transparent 70%),radial-gradient(70vw 50vw at 70% 105%,var(--glow-a),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}

/* top */
.top{padding-block:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sig{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sig b{color:var(--ink);font-weight:500}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:44px;align-items:center;padding-block:40px 36px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--plan);margin:0 0 14px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,5.4vw,64px);line-height:1;letter-spacing:-.03em;margin:0 0 18px;text-wrap:balance}
.hero h1 .p{color:var(--plan)} .hero h1 .b{color:var(--build)}
.lede{font-size:16.5px;color:var(--ink-2);max-width:34em;margin:0 0 24px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0;padding:0}
.stats div{display:flex;flex-direction:column}
.stats dt{order:2;font-size:12.5px;color:var(--ink-3)}
.stats dd{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats .b dd{color:var(--build)}

.compare{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 50px -24px rgba(20,30,60,.35);aspect-ratio:640/400;max-width:100%;user-select:none;touch-action:pan-y}
.compare svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.compare .wire{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.compare .handle{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
.compare .handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--surface)}
.compare .handle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;color:var(--paper);font-size:14px;letter-spacing:-2px}
.compare input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.compare .tag{position:absolute;top:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;pointer-events:none}
.compare .tag.l{left:12px;background:var(--plan);color:#fff}
.compare .tag.r{right:12px;background:var(--build);color:#1b1206}
.cap{font-size:12.5px;color:var(--ink-3);margin:10px 2px 0;display:flex;gap:8px;align-items:center}

/* filter rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.rail .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.fb .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.fb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fb[aria-pressed="true"] .n{color:inherit;opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.pm{background:var(--plan)} .dot.dev{background:linear-gradient(90deg,var(--plan) 50%,var(--build) 50%)}
.legend{font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:6px;border-radius:2px;display:inline-block}
.coftr{display:none;align-items:center;gap:6px;font-size:13px}
.coftr.on{display:inline-flex}
.coftr button{border:0;background:var(--plan-soft);color:var(--plan);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12.5px}

/* grid */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:34px 14px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h p{margin:0;color:var(--ink-3);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;padding-bottom:20px}
.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--card-line);background:var(--card);box-shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px -10px rgba(20,30,60,.25);border-radius:var(--r);overflow:hidden;cursor:pointer;padding:0;transition:transform .18s,box-shadow .18s,border-color .18s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(20,30,60,.45);border-color:color-mix(in srgb,var(--plan) 40%,var(--line))}
.card .art{position:relative;aspect-ratio:16/7;background-color:var(--card-art);background-image:radial-gradient(circle,color-mix(in srgb,var(--plan) 22%,transparent) 1.1px,transparent 1.6px);background-size:12px 12px;background-position:6px 6px;border-bottom:1px solid var(--card-line);overflow:hidden}
.card .art svg{width:100%;height:100%;display:block}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card .art .shots{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:11px;background:var(--scrim);color:#fff;border-radius:5px;padding:2px 7px}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.kind{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px;width:max-content}
.kind.pm{background:var(--plan-soft);color:var(--plan)}
.kind.dev{background:var(--build-soft);color:var(--build)}
.meta-l{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card h3{font-family:var(--f-display);font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--ink-2);font-size:14px}
.card .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cyc{display:flex;gap:3px}
.cyc i{width:22px;height:6px;border-radius:2px;background:var(--soft)}
.cyc i.on{background:var(--plan)} .cyc i.on.bd{background:var(--build)}
.more{font-size:12.5px;color:var(--plan);font-weight:500;white-space:nowrap}

/* career strip */
.career{padding-block:10px 40px}
.track{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px}
.lanes{position:relative;display:grid;gap:8px}
.lane{position:relative;height:26px}
.lane .lbl{position:absolute;left:0;top:-1px;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.bar{position:absolute;top:0;height:26px;border-radius:6px;border:0;cursor:pointer;padding:0}
.bar.work{background:var(--plan)} .bar.work.dv{background:linear-gradient(90deg,var(--plan),var(--build))}
.bar.study{background:repeating-linear-gradient(45deg,var(--soft) 0 5px,transparent 5px 10px);border:1px solid var(--line);cursor:default}
.bar[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.axis{position:relative;height:18px;margin-top:6px;border-top:1px solid var(--line)}
.axis span{position:absolute;top:3px;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.cos{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.co{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:13.5px}
.co small{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.co[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.co.study{cursor:default;opacity:.75;border-style:dashed}

.contact{border-top:1px solid var(--line);padding-block:40px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:28px 48px;align-items:center}
.contact h2{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 10px;letter-spacing:-.025em;text-wrap:balance}
.contact .lead{margin:0;color:var(--ink-2);max-width:30em}
html[lang="ko"] body{word-break:keep-all}
/* business card: compact, photo as a small portrait, faint circuit pattern fading in from the right edge */
.bcard{position:relative;width:100%;background:var(--card);border:1px solid var(--card-line);border-radius:14px;box-shadow:0 2px 4px rgba(20,30,60,.06),0 24px 48px -24px rgba(20,30,60,.45);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding:16px 16px 18px;overflow:hidden;transform:rotate(-1.5deg);transition:transform .25s}
.bcard:hover{transform:rotate(0)}
.bcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--plan) 50%,var(--build) 50%)}
.bcard .it{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-mask-image:linear-gradient(100deg,transparent 30%,rgba(0,0,0,.35) 60%,#000 100%);mask-image:linear-gradient(100deg,transparent 30%,rgba(0,0,0,.35) 60%,#000 100%)}
.bcard .ph{position:relative;z-index:1;width:100px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:1px solid var(--card-line);background:#fff;align-self:center}
.bcard .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.bcard .info{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.bcard .nm{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.02em;margin:0}
.bcard .ttl{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--plan);margin:3px 0 0;white-space:nowrap}
.bcard .lines{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.bcard .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center}
.bcard .ln .k{grid-column:1;font-size:10.5px;color:var(--ink-3);line-height:1.25}
.bcard .ln .v{grid-column:1;font-family:var(--f-mono);font-size:13px;line-height:1.35;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all}
.bcard .cp{grid-column:2;grid-row:1 / span 2;border:1px solid var(--card-line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:3px 9px;cursor:pointer;color:var(--ink-2)}
.bcard .cp:hover{color:var(--plan);border-color:var(--plan)}
@media (max-width:760px){.contact{grid-template-columns:minmax(0,1fr)}.bcard{transform:none;max-width:460px}}
@media (max-width:400px){.bcard{gap:12px;padding:12px 12px 14px}.bcard .ph{width:78px}.bcard .nm{font-size:18px}.bcard .ln .v{font-size:12px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}

/* detail drawer */
.ov{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;justify-content:flex-end;opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.drawer{width:min(760px,100%);height:100%;background:var(--paper);overflow:auto;transform:translateX(30px);transition:transform .25s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.ov.show .drawer{transform:none}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.dh .nav{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:16px}
.db{padding:22px 24px 48px;display:flex;flex-direction:column;gap:24px}
.db h2{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
.db .one{font-size:17px;color:var(--ink-2);margin:0;max-width:36em}
.blk h4{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .nd{border:1.5px solid var(--plan);color:var(--plan);background:var(--surface);border-radius:8px;padding:6px 11px;font-family:var(--f-mono);font-size:12.5px;animation:pulse var(--dur) infinite;animation-delay:var(--d)}
.flow.dv .nd{--hi:var(--build)}
.flow .ar{color:var(--ink-3);font-size:13px}
@keyframes pulse{0%,100%{box-shadow:none}8%{box-shadow:0 0 0 4px var(--plan-soft);background:var(--plan-soft)}16%{box-shadow:none}}
.flow.dv .nd{border-color:var(--build);color:var(--build)}
.flow.dv .nd{animation-name:pulseb}
@keyframes pulseb{0%,100%{box-shadow:none}8%{box-shadow:0 0 0 4px var(--build-soft);background:var(--build-soft)}16%{box-shadow:none}}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stages div{border-radius:6px;padding:7px 6px;text-align:center;font-size:12.5px;background:var(--soft);color:var(--ink-3)}
.stages div.on{background:var(--plan);color:#fff;font-weight:600}
.stages div.on.bd{background:var(--build);color:#1b1206}
.did{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:44em}
.did li::marker{color:var(--plan)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.subs div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px}
.subs small{display:block;color:var(--ink-3);font-size:12px}
.subs .nb{border-color:color-mix(in srgb,var(--plan) 45%,var(--line))}
.win{display:inline-flex;align-items:baseline;gap:8px;width:max-content;max-width:100%;border-radius:8px;padding:5px 10px;background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good);font-size:13px;font-weight:600}
.win b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.01em}
.win.big{margin-top:14px;padding:10px 16px;gap:12px;font-size:15px}
.win.big b{font-size:34px;line-height:1}
.win-note{margin:8px 0 0;font-size:14px;color:var(--ink-2);max-width:36em}
.nbadge{display:inline-flex;align-items:baseline;gap:5px;font-size:12px;font-weight:600;line-height:1.35;border-radius:5px;padding:3px 8px;width:max-content;max-width:100%;border:1px dashed currentColor}
.nbadge b{font-weight:400}
.nbadge.pm{color:var(--plan);background:var(--plan-soft)}
.nbadge.dev{color:var(--build);background:var(--build-soft)}
.nbadge.sm{margin-top:6px;font-size:11px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.facts dt{font-size:11.5px;color:var(--ink-3)} .facts dd{margin:0;font-size:14px;font-weight:500}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.shot{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);aspect-ratio:16/10}
.shot button.open{all:unset;cursor:zoom-in;display:block;width:100%;height:100%}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot .rm{position:absolute;top:6px;right:6px;border:0;border-radius:6px;background:var(--scrim);color:#fff;font-size:12px;padding:3px 8px;cursor:pointer}

/* ---------- illustrations ---------- */
function miniFlow(p){
  const W = 320, H = 140, n = p.flow.length, pad = 34;
  const pts = p.flow.map((_, i) => [pad + i * (W - 2*pad) / (n - 1), 62 + (i % 2 ? 16 : -16)]);
  let d = 'M' + pts[0].join(' ');
  for (let i = 1; i < n; i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], mx = (x0+x1)/2; d += ' C'+mx+' '+y0+' '+mx+' '+y1+' '+x1+' '+y1; }
  const dev = p.kind === 'dev', pc = 'var(--plan)', bc = dev ? 'var(--build)' : 'var(--plan)';
  let s = '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+pc+'" stroke-width="1.6" stroke-dasharray="4 4" opacity=".7"/>';
  pts.forEach(([x,y], i) => {
    const on = dev && i > 0 && i < n - 1;
    s += '<circle cx="'+x+'" cy="'+y+'" r="11" fill="var(--surface)" stroke="'+(on?bc:pc)+'" stroke-width="1.6"/>';
    s += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+(on?bc:pc)+'"/>';
    s += '<text x="'+x+'" y="'+(y + (i % 2 ? 28 : -18))+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--ink-2)">'+esc(p.flow[i])+'</text>';
  });
  if (!RM) for (let k = 0; k < 2; k++) s += '<circle r="4" fill="'+bc+'"><animateMotion dur="'+(n*0.9)+'s" begin="'+(k*n*0.45)+'s" repeatCount="indefinite" path="'+d+'"/></circle>';
  return s + '</svg>';
}

function bindCompare(){
  const r = $('#cmp-r'), wire = $('#cmp-wire'), h = $('#cmp-h');
  const set = v => { wire.style.clipPath = 'inset(0 '+(100 - v)+'% 0 0)'; h.style.left = v + '%'; };
  r.addEventListener('input', () => set(+r.value)); set(50);
  if (!RM){ let v = 50, dir = 1, n = 0; const tick = () => { if (r.dataset.touched) return; v += dir * .6; if (v > 70 || v < 30) { dir *= -1; n++; } set(v); r.value = v; if (n < 2) requestAnimationFrame(tick); else set(50); };
    r.addEventListener('pointerdown', () => r.dataset.touched = 1); r.addEventListener('keydown', () => r.dataset.touched = 1); setTimeout(() => requestAnimationFrame(tick), 600); }
}

/* ---------- detail ---------- */
function detailHTML(p){
  const x = L(p), T0 = t(), sh = shotsOf(p.id), i = P.indexOf(p), dev = p.kind === 'dev';
  let h = '<div class="dh"><div class="nav"><button class="ib" data-nav="-1" aria-label="'+T0.prev+'" title="'+T0.prev+'">←</button><button class="ib" data-nav="1" aria-label="'+T0.next+'" title="'+T0.next+'">→</button></div>'+
    '<span class="mono" style="font-size:12px;color:var(--ink-3)">'+String(i+1).padStart(2,'0')+' / '+P.length+'</span><button class="ib" data-close="1" aria-label="'+T0.close+'" title="'+T0.close+'">✕</button></div><div class="db">';
  h += '<div><div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">'+kindTag(p)+nbTag(p)+'</div><h2 id="d-title">'+esc(x.t)+'</h2><p class="one">'+esc(x.one)+'</p>'+(p.win?'<div class="win big"><b>↗ '+winN(p.win)+'</b><span>'+esc(p.win[lang])+'</span></div>'+(p.win.note?'<p class="win-note">'+esc(p.win.note[lang])+'</p>':''):'')+'</div>';
  h += '<dl class="facts"><div><dt>'+T0.company+'</dt><dd>'+esc(CO[p.co][lang])+'</dd></div><div><dt>'+T0.period+'</dt><dd class="mono" style="font-size:13px">'+CO[p.co].y+'</dd></div><div><dt>'+T0.role+'</dt><dd>'+esc(x.role)+'</dd></div><div><dt>'+T0.where+'</dt><dd>'+esc(CO[p.co].place[lang])+'</dd></div></dl>';
  if (sh.length || assets) h += '<div class="blk"><h4>'+T0.screens+'</h4><div class="gal">'+
    sh.map((s,k) => '<div class="shot"><button class="open" data-lb="'+k+'" aria-label="'+esc(x.t)+' '+(k+1)+'"><img src="'+esc(srcOf(s))+'" alt="'+esc(x.t)+' '+(k+1)+'" loading="lazy"></button>'+(assets?'<button class="rm" data-rm="'+k+'">'+T0.rm+'</button>':'')+'</div>').join('')+
    (assets ? '<label class="drop" id="drop" for="shot-in"><b>+</b><span>'+T0.add+'</span><small>'+T0.addHint+'</small></label><input type="file" id="shot-in" class="vh" accept="image/*" multiple>' : '')+
    '</div>'+(assets?'<p class="note">'+T0.addNote+'</p>':'')+'</div>';
  h += '<div class="blk"><h4>'+T0.flow+'</h4><div class="flow'+(dev?' dv':'')+'" style="--dur:'+(p.flow.length*0.7)+'s">'+p.flow.map((f,k) => (k?'<span class="ar">→</span>':'')+'<span class="nd" style="--d:'+(k*0.7).toFixed(2)+'s">'+esc(f)+'</span>').join('')+'</div></div>';
  h += '<div class="blk"><h4>'+T0.stages+'</h4><div class="stages">'+SK.map((k,j) => '<div class="'+(p.st.includes(k)?'on'+(k==='build'?' bd':''):'')+'">'+STAGES[lang][j]+'</div>').join('')+'</div></div>';
  h += '<div class="blk"><h4>'+T0.did+'</h4><ul class="did">'+x.b.map(b => '<li>'+esc(b)+'</li>').join('')+'</ul></div>';
  if (x.subs) h += '<div class="blk"><h4>'+T0.subs+'</h4><div class="subs">'+x.subs.map(s => '<div'+(s[2]?' class="nb"':'')+'>'+esc(s[0])+'<small>'+esc(s[1])+'</small>'+(s[2]?'<span class="nbadge pm sm"><b>★</b>'+esc(t().nbSub)+'</span>':'')+'</div>').join('')+'</div></div>';
  h += '<div class="blk"><h4>'+T0.stack+'</h4><div class="chips">'+p.stack.map(s => '<span>'+esc(s)+'</span>').join('')+'</div></div>';
  if (p.link) h += '<div><a class="btn pri" href="'+esc(p.link)+'" target="_blank" rel="noopener">'+T0.link+' ↗</a></div>';
  return h + '</div>';
}
let lastFocus = null;
function openP(id, fromHash){
  const p = P.find(q => q.id === id); if (!p) return;
  openId = id;
  let ov = $('#ov');
  if (!ov){ ov = document.createElement('div'); ov.id = 'ov'; ov.className = 'ov'; ov.innerHTML = '<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" id="drawer"></div>'; document.body.appendChild(ov);
    lastFocus = document.activeElement; requestAnimationFrame(() => ov.classList.add('show')); document.body.style.overflow = 'hidden'; }
  $('#drawer').innerHTML = detailHTML(p); $('#drawer').scrollTop = 0;
  if (!fromHash && location.hash !== '#'+id) { try { history.replaceState(null, '', '#'+id); } catch(e) { location.hash = id; } }
  const c = $('#drawer [data-close]'); c && c.focus({preventScroll:true});
}
function closeP(){
  const ov = $('#ov'); if (!ov) return; openId = null;
  ov.classList.remove('show'); setTimeout(() => ov.remove(), RM ? 0 : 200); document.body.style.overflow = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
}

function toast(msg){
  let el = $('#toast'); if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3200);
}

/* ---------- screenshots (editors only) ---------- */
const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
  const json = JSON.stringify(DATA).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(document.title)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    $('#pf-fonts').outerHTML+'\n'+$('#pf-style').outerHTML+'\n<div id="app"></div>\n'+
    '<script type="application/json" id="pf-data">'+json+'<\/script>\n'+
    '<script id="pf-script">'+$('#pf-script').textContent+'<\/script></body></html>';
}
async function persist(msg){
  if (!art) return false;
  DATA.savedAt = Date.now();
  try { sessionStorage.setItem('pf-reopen', openId || ''); } catch(e) {}
  try { await art.publish(buildDoc()); toast(msg); return true; }
  catch(err){ toast(err && err.code === 'conflict' ? 'Someone else saved first. The page will reload with their version.' : 'Could not save: '+(err && err.message || 'unknown error')); return false; }
}
async function addShots(files){
  if (!assets || !openId) return;
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) return toast(lang==='ko' ? '이미지 파일을 선택해 주세요.' : 'Choose image files (PNG or JPG).');
  const id = openId, out = [];
  for (let i = 0; i < list.length; i++){
    toast(t().up(i+1, list.length));
    try { const a = await assets.upload(list[i]); out.push({id:a.id, url:a.url}); }
    catch(err){ toast((list[i].name||'File')+': '+(err && err.message || 'upload failed')); }
  }
  if (!out.length) return;
  DATA.shots[id] = shotsOf(id).concat(out);
  openP(id, true); renderGrid();
  await persist(t().saved);
}
let rmArm = {k:null, at:0};
async function rmShot(k){
  if (rmArm.k !== k || Date.now() - rmArm.at > 3000){ rmArm = {k, at:Date.now()}; const b = $('#drawer [data-rm="'+k+'"]'); if (b){ b.textContent = t().rm2; setTimeout(() => { if (b.isConnected) b.textContent = t().rm; }, 3000); } return; }
  rmArm = {k:null, at:0};
  const id = openId, s = shotsOf(id)[k]; if (!s) return;
  DATA.shots[id] = shotsOf(id).filter((_, j) => j !== k);
  openP(id, true); renderGrid();
  if (await persist(t().removed)) { try { await assets.delete(s.id); } catch(e) {} }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-open], label'); if (!el) return;
  if (el.dataset.lang){ lang = el.dataset.lang; try { localStorage.setItem('pf-lang', lang); } catch(err) {} render(); if (openId) openP(openId, true); return; }
  if (el.dataset.kind){ kindF = el.dataset.kind; refreshFilters(); return; }
  if (el.dataset.co){ coF = coF === el.dataset.co ? null : el.dataset.co; refreshFilters(); $('#grid').scrollIntoView({behavior: RM ? 'auto' : 'smooth', block:'start'}); return; }
  if (el.dataset.clear){ coF = null; refreshFilters(); return; }
  if (el.dataset.open){ openP(el.dataset.open); return; }
  if (el.dataset.close){ closeP(); return; }
  if (el.dataset.nav){ const i = P.findIndex(p => p.id === openId); openP(P[(i + +el.dataset.nav + P.length) % P.length].id); return; }
  if (el.dataset.lb != null){ const s = shotsOf(openId)[+el.dataset.lb]; if (!s) return;
    const lb = document.createElement('div'); lb.className = 'lb'; lb.tabIndex = -1; lb.innerHTML = '<img src="'+esc(srcOf(s))+'" alt="">';
    lb.addEventListener('click', () => lb.remove()); document.body.appendChild(lb); lb.focus(); return; }
  if (el.dataset.rm != null){ rmShot(+el.dataset.rm); return; }
  if (el.dataset.copy){ const tgt = $('#'+el.dataset.copy);
    try { await navigator.clipboard.writeText(tgt.textContent); toast(t().copied+': '+tgt.textContent); }
    catch(err){ const r = document.createRange(); r.selectNodeContents(tgt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t().copyFail); }
  }
});
document.addEventListener('mousedown', e => { const ov = $('#ov'); if (ov && e.target === ov) closeP(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const lb = $('.lb'); if (lb) return lb.remove(); if (openId) closeP(); }
  if (openId && !$('.lb') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.matches('input')){ const i = P.findIndex(p => p.id === openId); openP(P[(i + (e.key === 'ArrowRight' ? 1 : -1) + P.length) % P.length].id); }
});
document.addEventListener('change', e => { if (e.target.id === 'shot-in' && e.target.files.length){ addShots(e.target.files); e.target.value = ''; } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); addShots(e.dataTransfer.files); } });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (P.some(p => p.id === id)) openP(id, true); else if (openId) closeP(); });

render();
let reopen = ''; try { reopen = sessionStorage.getItem('pf-reopen') || ''; sessionStorage.removeItem('pf-reopen'); } catch(e) {}
const start = location.hash.slice(1) || reopen;
if (P.some(p => p.id === start)) openP(start, !!location.hash);

/* screenshot editing is locked: the upload and remove controls never appear for anyone.
   To unlock later, set EDIT_SCREENS to true. */
const EDIT_SCREENS = false;
if (EDIT_SCREENS && window.claude && window.claude.use){
  Promise.all([window.claude.use('assets').catch(() => null), window.claude.use('artifact').catch(() => null)]).then(([a, s]) => {
    if (a && s){ assets = a; art = s; if (openId) openP(openId, true); }
  });
}
})();
</script>
